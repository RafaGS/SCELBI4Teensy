; SCELBI-8H — Teensy 4.1
; Versions pinned to make the toolchain reproducible.
; Platform manifest v6.0.0 declares Teensyduino 1.162.0 and ARM toolchain 15.2.1.

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino

; Explicitly pin the framework, compiler and Teensy upload utility as well.
platform_packages =
    framework-arduinoteensy@1.162.0
    toolchain-gccarmnoneeabi-teensy@1.150201.0
    tool-teensy@1.162.0

monitor_speed = 115200
monitor_filters = send_on_enter

; These definitions are needed by project and framework code.
build_flags =
    -D SCELBI_RAM_KB=4
    -D USB_SERIAL

; Apply strict warnings to our own source files only. Putting -Wall/-Wextra in
; build_flags also warns inside Teensy/SdFat framework sources.
build_src_flags =
    -Wall
    -Wextra
    -Wpedantic

; No external library dependencies at this stage. SD.h is provided by the
; pinned Teensy Arduino framework and BUILTIN_SDCARD selects the onboard slot.
